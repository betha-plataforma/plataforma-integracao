spring:
  thymeleaf:
    cache: false
  data:
    mongodb:
      uri: "mongodb://rootuser:rootpass@localhost:27018/plataforma-integracao?authSource=admin"

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: "${BETHA_SESSION_COOKIE_NAME}"
        http-only: true
        same-site: lax

betha:
  auth:
    oauth:
      client:
        id: "${BETHA_CLIENT_ID}"
        secret: "${BETHA_CLIENT_SECRET}"
        callback: "${BETHA_CALLBACK_URL}"
        redirect: "${BETHA_APP_URL}"
        logout-continue: "${BETHA_LOGOUT_CONTINUE_URL}"
        scopes: "${BETHA_OAUTH_SCOPES}"
  system:
    id: "${BETHA_SYSTEM_ID}"
  services:
    login: "${BETHA_LOGIN_URL}"
    oauth: "${BETHA_OAUTH_URL}"
    users: "${BETHA_USERS_URL}"
    user-accounts: "${BETHA_USER_ACCOUNTS_URL}"
    sessions: "${BETHA_SESSOES_URL}"
    manager: "${BETHA_GERENCIADOR_AUTORIZACOES_URL}"
    notifications: "${BETHA_NOTIFICACOES_URL}"
    notifications-ws: "${BETHA_NOTIFICACOES_WS_URL}"
  tributos:
    url: "https://tributos.suite.betha.cloud/dados/v1/"
    accessToken: "Bearer xxxxxxxxxxxxxxxxxxxxxxxx"
    userAccess: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  cadastro-unico:
    url: "https://plataforma-cadastro-unico.betha.cloud/api/v2/"
    accessToken: "xxxx"

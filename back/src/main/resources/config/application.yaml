spring:
  thymeleaf:
    cache: false
  data:
    mongodb:
      uri: "mongodb://rootuser:rootpass@localhost:27018/plataforma-integracao?authSource=admin"

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        name: "PLATAFORMA_INTEGRACAO_SESSION"
        http-only: true
        same-site: lax

betha:
  auth:
    oauth:
      client:
        id: "xxxxxxxxxxxxxxxxx"
        secret: "xxxxxxxxxxxxx"
        callback: "http://localhost:8080/callback"
        redirect: "http://localhost:4200"
        logout-continue: "http://localhost:4200/login"
        scopes: "contas-usuarios.suite,user-accounts.suite,notifications.suite"
  system:
    id: 999
  services:
    login: "https://login.betha.cloud/servicelogin"
    oauth: "https://plataforma-oauth.betha.cloud/auth/oauth2"
    user-accounts: "https://plataforma-autorizacoes.betha.cloud/user-accounts/v0.1/api"
    users: "https://plataforma-usuarios.betha.cloud/usuarios/v0.1/api/usuarios/"
    sessions: "https://plataforma-autorizacoes-sessoes.betha.cloud/user-accounts/v0.1/sessions/api"
    manager: "https://gerenciador-autorizacoes.plataforma.betha.cloud"
    notifications: "https://plataforma-notificacoes.betha.cloud/notifications"
    notifications-ws: "wss://plataforma-notificacoes.betha.cloud/notifications/v2/channel"
  tributos:
    url: "https://tributos.suite.betha.cloud/dados/v1/"
    accessToken: "Bearer xxxxxxxxxxxxxxxxxxxxxxxx"
    userAccess: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  cadastro-unico:
    url: "https://plataforma-cadastro-unico.betha.cloud/api/v2/"
    accessToken: "xxxx"
